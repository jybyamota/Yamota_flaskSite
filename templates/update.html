{% extends "base.html" %}

{% block title %}Update Item{% endblock %}

{% block content %}
    <main>
        <h1>Update Item</h1>
        <form method="post">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" value="{{ item.name }}" maxlength="100" required>
            <button type="submit">Update</button>
        </form>
    </main>
{% endblock %}
